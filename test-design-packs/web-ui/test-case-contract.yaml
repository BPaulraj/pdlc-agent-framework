# Optional interface_details shape for interface: web-ui — see guideline.md.
# Most web-ui cases set interface_details: {} (or omit the key); fill it in only when the
# case's behaviour genuinely depends on viewport or browser, not as a default habit.
interface_details:
  viewport: "mobile | tablet | desktop"    # omit if behaviour is viewport-independent
  browser: "chromium | firefox | webkit"   # omit if behaviour is browser-independent

