# interface_details shape for interface: batch-async — see guideline.md.
interface_details:
  trigger: "schedule | queue_message | event | cli | api_triggered"
  trigger_detail: "concrete trigger, e.g. cron expression, queue name, topic name"
  input: {}                       # concrete synthetic message/file/args
  completion_signal: "how completion is observed — poll field / output artifact / log line"
  expected_side_effects: []       # specific, checkable outcomes — never "processing succeeds"
  sla_seconds: null               # omit if the story states no timing requirement
  retry_behaviour: null           # omit if not relevant to this case

