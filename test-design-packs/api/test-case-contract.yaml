# interface_details shape for interface: api — see guideline.md.
interface_details:
  method: "GET | POST | PUT | PATCH | DELETE"
  endpoint: "/path/template/{id}"      # template, not a resolved URL — no real hosts/ports
  auth: "role/scope required"
  request_body: {}                     # omit for GET/DELETE with no body
  expected_status: 200
  expected_response: {}                # the specific fields/values this case checks, not the full schema
  headers: {}                          # only when a specific header matters to this case

