# interface_details shape for interface: db-validation — see guideline.md.
interface_details:
  seed_data: {}          # concrete before-state: rows/fixtures, synthetic
  action: "migration | ETL job | trigger | direct query — be specific"
  target: "table/view/report the assertion reads"
  assertions: []         # exact values/invariants, not just row presence
  isolation: "how this run's data is isolated and reset"

